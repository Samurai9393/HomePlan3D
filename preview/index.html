<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HomePlan 3D – Vorschau</title>
    <style>
      /* Like HA: the panel's parent has no explicit height, the panel sizes itself. */
      body {
        margin: 0;
        background: #070b14;
      }
    </style>
  </head>
  <body>
    <homeplan3d-panel></homeplan3d-panel>
    <script type="module">
      // Mock of the Home Assistant frontend object with invented demo data.
      import { DEMO_AREAS, DEMO_BUILDING, DEMO_FLOORS, DEMO_PACK, DEMO_ENTITIES, DEMO_STATES, DEMO_PICTURES, DEMO_PLANS } from "./demo-data.js";
      import { DEMO_SHOP_PACKS } from "./demo-packs.js";
      import { demoHistory } from "./demo-history.js";

      const params = new URLSearchParams(location.search);
      // the power flow lines are on with ?flows (and off without, whatever an earlier page stored)
      try {
        localStorage.setItem("homeplan3d.flows", params.has("flows") ? "1" : "0");
      } catch {}
      // the demo always opens in Neon, whatever style a visitor picked last time (?style=<id> opens another one)
      const DEMO_STYLES = ["neon", "blueprint", "day", "focus", "synth", "cozy", "evening", "winter", "model", "pastel", "warm"];
      try {
        const wanted = params.get("style");
        localStorage.setItem("homeplan3d.theme", DEMO_STYLES.includes(wanted) ? wanted : "neon");
        localStorage.removeItem("homeplan3d.zoom_style");
      } catch {}
      let building = params.has("empty") ? { version: 1, floors: [], settings: { wall_exterior: 0.24, wall_interior: 0.12, grid: 0.05 } } : DEMO_BUILDING;
      // the demo's start view is framed for a wide screen: a phone held upright needs it from further away
      const portrait = innerWidth / innerHeight;
      if (building.settings.start_view && portrait < 0.85) {
        building = structuredClone(building);
        building.settings.start_view.radius *= Math.min(1.9, 0.85 / portrait);
      }
      let revision = 1;
      // ?plans: further floor plans (the garden house, a holiday flat); the main plan is `building` above
      const EN_PLAN = { Gartenhaus: "Garden house", Ferienwohnung: "Holiday flat" };
      const english = params.get("lang") === "en";
      const plans = params.has("plans") ? structuredClone(DEMO_PLANS).map((pl) => ({ ...pl, name: english ? (EN_PLAN[pl.name] ?? pl.name) : pl.name, revision: 1, created: Date.now() / 1000 })) : [];
      const planTrash = [];
      let mainEntry = { id: "main", name: params.has("plans") ? (english ? "House" : "Haus") : null, icon: null, site: null, created: null };
      let locatePlan = "main";
      const sizeOf = (b) => ({ floors: b.floors.length, rooms: b.floors.reduce((n, f) => n + f.rooms.length, 0), furniture: b.floors.reduce((n, f) => n + f.furniture.length, 0) });
      const planList = () => ({
        plans: [{ ...mainEntry, revision, ...sizeOf(building) }, ...plans.map(({ building: b, ...e }) => ({ ...e, ...sizeOf(b) }))],
        trash: planTrash.map(({ building: b, ...e }) => ({ ...e, ...sizeOf(b) })),
        locate_plan: locatePlan,
      });
      const planOf = (id) => plans.find((pl) => pl.id === id);
      const notifyPlans = () => {
        for (const [cb, m] of listeners) if (m?.type === "homeplan3d/plans/subscribe") cb(planList());
      };
      const notifyBuilding = (plan, rev) => {
        for (const [cb, m] of listeners) if (m?.type !== "homeplan3d/plans/subscribe" && ((m?.plan ?? "main") === plan || m?.plan === "*")) cb({ revision: rev, plan });
      };
      // off like on a fresh installation; the screenshots switch it on through the editor
      const diag = { enabled: false };
      const images = { ...DEMO_PICTURES };
      // subscriptions and what they asked for (a plan's changes reach only its own)
      const listeners = new Map();
      // invented restore points
      const history = [{ id: "s0", revision: 0, saved_at: Date.now() / 1000 - 3600, building: structuredClone(building) }];

      // furniture packs: the invented demo pack, plus local pack sources from private/ (not in git)
      let importedPacks = null;
      const moduleCode = {};
      async function previewPacks() {
        if (importedPacks === null) {
          importedPacks = [DEMO_PACK];
          try {
            const res = await fetch("../private/packs/starter.json");
            if (res.ok) importedPacks.push({ licensee: null, ...(await res.json()) });
            const index = await fetch("../private/packs/src/index.json");
            for (const name of index.ok ? await index.json() : []) {
              const pack = await fetch(`../private/packs/src/${name}`);
              if (!pack.ok) continue;
              const data = await pack.json();
              // a pack that carries a module (a local build with its code): the code is served apart, the module counts as approved
              if (data.module?.code) {
                moduleCode[data.id] = { code: data.module.code, release: data.release ?? 1, api: data.module.api ?? 1 };
                data.module = { api: data.module.api ?? 1, kind: data.module.kind ?? "stage", approved: true };
              }
              importedPacks.push({ licensee: null, ...data });
            }
          } catch {
            // no local packs
          }
          // the online demo has no private/ packs: five models of the garden and vehicle packs stand in for them
          for (const pack of DEMO_SHOP_PACKS) if (!importedPacks.some((p) => p.id === pack.id)) importedPacks.push(pack);
        }
        return importedPacks;
      }

      const hass = {
        language: params.get("lang") || "de",
        user: { is_admin: !params.has("user"), name: "Demo" },
        areas: DEMO_AREAS,
        floors: DEMO_FLOORS,
        entities: DEMO_ENTITIES,
        devices: {},
        // an invented spot in Germany: the time travel computes the sun from it
        config: { latitude: 52.52, longitude: 13.405 },
        states: structuredClone(DEMO_STATES),
        connection: {
          async subscribeMessage(cb, msg) {
            listeners.set(cb, msg);
            return async () => listeners.delete(cb);
          },
        },
        // the REST calls the view makes: only the invented waste calendar (residual waste today, paper tomorrow, bio in 3 days)
        async callApi(method, path) {
          if (!path.startsWith("calendars/calendar.abfallkalender")) throw new Error("not in the demo");
          const day = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
          return [
            { summary: "Restmüll", start: { date: day(0) }, end: { date: day(1) } },
            { summary: "Papiertonne", start: { date: day(1) }, end: { date: day(2) } },
            { summary: "Biotonne", start: { date: day(3) }, end: { date: day(4) } },
          ];
        },
        async callService(domain, service, data) {
          // enough behaviour to see the effect of the room panel and of taps in 3D
          const states = { ...current.states };
          for (const id of [].concat(data?.entity_id ?? [])) {
            const st = states[id];
            if (!st) continue;
            const next = { ...st, attributes: { ...st.attributes } };
            const a = next.attributes;
            const setOn = (on) => {
              next.state = on ? "on" : "off";
              if (domain === "light" && on && a.brightness === undefined) a.brightness = 200;
              if (domain === "light" && !on) delete a.brightness;
            };
            if (service === "toggle") setOn(st.state !== "on");
            else if (service === "turn_off") setOn(false);
            else if (service === "turn_on" && domain === "light") {
              setOn(true);
              if (data.brightness_pct !== undefined) a.brightness = Math.round((data.brightness_pct / 100) * 255);
              if (data.color_temp_kelvin !== undefined) Object.assign(a, { color_temp_kelvin: data.color_temp_kelvin, color_mode: "color_temp" });
              if (data.rgb_color) Object.assign(a, { rgb_color: data.rgb_color, color_mode: "hs" });
            } else if (service === "open_cover") {
              next.state = "open";
              a.current_position = 100;
            } else if (service === "close_cover") {
              next.state = "closed";
              a.current_position = 0;
            } else if (service === "set_cover_position") {
              a.current_position = data.position;
              next.state = data.position > 0 ? "open" : "closed";
            } else if (service === "set_temperature") a.temperature = data.temperature;
            else if (service === "set_hvac_mode") next.state = data.hvac_mode;
            else if (service === "media_play_pause") next.state = st.state === "playing" ? "paused" : "playing";
            else if (service === "volume_set") a.volume_level = data.volume_level;
            states[id] = next;
          }
          current = { ...current, states };
          if (window.fp3dCard) window.fp3dCard.hass = current;
          else if (window.fp3dPanel) window.fp3dPanel.hass = current;
        },
        async callWS(msg) {
          switch (msg.type) {
            // a local module's code (see previewPacks)
            case "homeplan3d/modules/code":
              if (moduleCode[msg.pack_id]) return moduleCode[msg.pack_id];
              throw new Error("no such module in the demo");
            // the card templates' overview of the open screens (invented devices)
            case "homeplan3d/screens/list": {
              const t = Date.now() / 1000;
              return {
                screens: [
                  { id: "s1", kind: "card", template: "kitchen_tablet", screen: null, device: "Fire HD 10 · Fully Kiosk", version: "2.3.0", user: "Tablet", since: t - 9 * 3600, reloadable: true },
                  { id: "s2", kind: "card", template: "hall", screen: null, device: "Fire 7 · Fully Kiosk", version: "2.2.0", user: "Tablet", since: t - 30 * 3600, reloadable: true },
                  { id: "s3", kind: "panel", template: null, screen: null, device: "Windows · Chrome", version: "2.3.0", user: "Demo", since: t - 600, reloadable: true },
                ],
              };
            }
            case "homeplan3d/screens/reload":
              return { sent: true };
            case "homeplan3d/building/get": {
              if (msg.plan && msg.plan !== "main") {
                const pl = planOf(msg.plan);
                if (!pl) throw { code: "not_found", message: "Floor plan not found" };
                return { building: structuredClone(pl.building), revision: pl.revision, plan: pl.id };
              }
              // the online demo has no private packs: their items would stand as grey boxes, so leave them out
              const packs = await previewPacks();
              const known = new Set(packs.flatMap((p) => p.items.map((it) => `pack:${p.id}:${it.id}`)));
              const shown = structuredClone(building);
              for (const f of shown.floors) f.furniture = f.furniture.filter((m) => !m.type.startsWith("pack:") || known.has(m.type));
              return { building: shown, revision };
            }
            case "homeplan3d/building/save":
              // ?savefail simulates a backend that still runs an older version
              if (params.has("savefail")) throw { code: "invalid_format", message: "extra keys not allowed @ data['building']['floors'][0]['furniture'][0]['entity']" };
              if (msg.plan && msg.plan !== "main") {
                const pl = planOf(msg.plan);
                pl.building = structuredClone(msg.building);
                pl.revision += 1;
                notifyBuilding(pl.id, pl.revision);
                return { revision: pl.revision };
              }
              building = structuredClone(msg.building);
              revision += 1;
              notifyBuilding("main", revision);
              return { revision };
            case "homeplan3d/plans/list":
              return planList();
            case "homeplan3d/plans/create": {
              const id = `p${Math.random().toString(36).slice(2, 10)}`;
              const from = msg.copy_of ? (msg.copy_of === "main" ? building : planOf(msg.copy_of).building) : msg.building;
              plans.push({ id, name: msg.name, icon: msg.icon ?? null, site: null, created: Date.now() / 1000, revision: 1, building: structuredClone(from ?? { version: 1, floors: [], settings: { wall_exterior: 0.24, wall_interior: 0.12, grid: 0.05 } }) });
              notifyPlans();
              return { plan: id };
            }
            case "homeplan3d/plans/update": {
              const entry = msg.plan === "main" ? mainEntry : planOf(msg.plan);
              for (const k of ["name", "icon", "site"]) if (k in msg) entry[k] = msg[k];
              notifyPlans();
              return null;
            }
            case "homeplan3d/plans/order": {
              const rank = new Map(msg.plans.map((id, i) => [id, i]));
              plans.sort((a, b) => (rank.get(a.id) ?? 99) - (rank.get(b.id) ?? 99));
              notifyPlans();
              return null;
            }
            case "homeplan3d/plans/delete": {
              const i = plans.findIndex((pl) => pl.id === msg.plan);
              planTrash.push({ ...plans[i], deleted_at: Date.now() / 1000 });
              plans.splice(i, 1);
              notifyPlans();
              return null;
            }
            case "homeplan3d/plans/restore": {
              const i = planTrash.findIndex((pl) => pl.id === msg.plan);
              const { deleted_at, ...pl } = planTrash[i];
              plans.push(pl);
              planTrash.splice(i, 1);
              notifyPlans();
              return null;
            }
            case "homeplan3d/plans/locate":
              locatePlan = msg.plan;
              notifyPlans();
              return null;
            // the opt-in reports (only shown with the lab switch): a made-up status and preview
            case "homeplan3d/diagnostics/client":
              return { enabled: diag.enabled };
            case "homeplan3d/diagnostics/get":
            case "homeplan3d/diagnostics/set":
            case "homeplan3d/diagnostics/delete": {
              if (msg.type === "homeplan3d/diagnostics/set") diag.enabled = msg.enabled;
              if (msg.type === "homeplan3d/diagnostics/delete") diag.enabled = false;
              return {
                enabled: diag.enabled,
                last_daily: null,
                can_delete: diag.enabled,
                endpoint: "https://api.mastershort.de/telemetry/v1/report",
                preview: {
                  v: 1, id: diag.enabled ? "3f0c9a52-7d1e-4b8a-9c61-2e5f8d4a7b10" : null, kind: "daily", neonplan: "1.17.0", ha: "2026.10.1", python: "3.13", lang: "de",
                  packs: ["mastershort.pro_energy"], pro: ["energy_pro"],
                  plan: { floors: building.floors.length, rooms: building.floors.reduce((n, f) => n + f.rooms.length, 0), furniture: building.floors.reduce((n, f) => n + f.furniture.length, 0), devices_linked: building.floors.reduce((n, f) => n + f.placements.length, 0), outdoor: 0, cameras: 1 },
                  clients: diag.enabled ? [{ device: "tablet", browser: "Silk 120", os: "Android 9", low_end: true, render_scale: 0.75, fps: 24, gpu_tier: "low", views: { "3d": 12, editor: 3 } }] : [],
                  errors: [],
                },
              };
            }
            case "homeplan3d/history/list":
              return { snapshots: history.map(({ building: b, ...rest }) => ({ ...rest, floors: b.floors.length, rooms: b.floors.reduce((n, f) => n + f.rooms.length, 0), furniture: b.floors.reduce((n, f) => n + f.furniture.length, 0) })).reverse() };
            case "homeplan3d/history/snapshot":
              history.push({ id: `s${history.length + 1}`, revision, saved_at: Date.now() / 1000, building: structuredClone(building) });
              return null;
            case "homeplan3d/history/restore": {
              const snap = history.find((h) => h.id === msg.snapshot_id);
              building = structuredClone(snap.building);
              revision += 1;
              notifyBuilding("main", revision);
              return { revision };
            }
            case "homeplan3d/image/get":
              if (!images[msg.image_id]) throw { code: "not_found", message: "Image not found" };
              return { data: images[msg.image_id] };
            case "homeplan3d/image/set":
              images[msg.image_id] = msg.data;
              return null;
            case "homeplan3d/packs/list":
              return { packs: await previewPacks() };
            case "homeplan3d/packs/import": {
              // local packs are unsigned; a payload with a known id and name counts as valid
              const data = JSON.parse(msg.pack);
              const payload = data.payload ?? data;
              if (!payload?.id || !payload?.name) throw { code: "invalid_pack", message: "invalid pack" };
              importedPacks = [...importedPacks.filter((p) => p.id !== payload.id), payload];
              return { id: payload.id, name: payload.name, publisher: payload.publisher ?? "local", licensee: null, items: (payload.items ?? []).length };
            }
            case "homeplan3d/packs/remove":
              importedPacks = importedPacks.filter((p) => p.id !== msg.pack_id);
              return null;
            case "recorder/statistics_during_period": {
              // the meters' hourly change since midnight (gas and water on the house card)
              if ((msg.types ?? []).includes("change")) {
                const hours = new Date().getHours() + 1;
                const per = { "sensor.gaszaehler": 0.11, "sensor.wasserzaehler": 0.012 };
                return Object.fromEntries((msg.statistic_ids ?? []).map((id) => [id, Array.from({ length: hours }, (_, i) => ({ start: i, change: (per[id] ?? 0) * (0.6 + 0.8 * Math.abs(Math.sin(i))) }))]));
              }
              // today's solar curve: a sunny day, five-minute means from midnight up to now
              const midnight = new Date();
              midnight.setHours(0, 0, 0, 0);
              const slots = Math.floor((Date.now() - midnight.getTime()) / 300000) + 1;
              const peak = Number(hass.states["sensor.pv_leistung"]?.state) > 2000 ? 7100 : 3400;
              const curve = Array.from({ length: slots }, (_, i) => {
                const h = (i * 5) / 60;
                const sun = Math.max(0, Math.sin((Math.PI * (h - 6.2)) / 13.2));
                return { start: midnight.getTime() + i * 300000, end: midnight.getTime() + (i + 1) * 300000, mean: Math.round(peak * Math.pow(sun, 1.6) * (0.9 + 0.1 * Math.sin(i * 0.7))) };
              });
              return Object.fromEntries((msg.statistic_ids ?? []).map((id) => [id, curve]));
            }
            case "homeplan3d/timetravel/history":
              // the time travel: an invented week of the demo household (?tt=07:42 or ?tt=-3h opens it there)
              return demoHistory(msg, hass.states);
            case "history/history_during_period": {
              // invented motion of the last half hour: hall, kitchen, then the living-room camera
              const now = Date.now() / 1000;
              const on = (entity, ...minutesAgo) => [entity, minutesAgo.flatMap((m) => [{ s: "on", lu: now - m * 60 }, { s: "off", lu: now - m * 60 + 40 }])];
              return Object.fromEntries([
                on("binary_sensor.flur_bewegung", 26, 12),
                on("binary_sensor.kueche_praesenz", 22, 9),
                on("binary_sensor.wohnzimmer_kamera_bewegung", 17, 3),
                on("binary_sensor.garage_auto", 28),
              ]);
            }
            default:
              throw { code: "unknown_command", message: msg.type };
          }
        },
      };

      if (params.has("pv")) {
        // ?pv=5400 sets the solar power (W) of the demo plant, e.g. a sunny noon
        hass.states["sensor.pv_leistung"] = { ...hass.states["sensor.pv_leistung"], state: params.get("pv") };
      }
      if (params.has("weather")) {
        // ?weather=pouring|snowy|fog|lightning-rainy|cloudy… sets the demo weather
        hass.states["weather.zuhause"].state = params.get("weather");
        hass.states["weather.zuhause"].attributes = { ...hass.states["weather.zuhause"].attributes, cloud_coverage: 85, wind_speed: 25, wind_speed_unit: "km/h" };
      }
      if (params.has("alerts")) {
        // ?alerts: smoke in the kitchen while it rains on open windows
        hass.states["binary_sensor.kueche_rauch"].state = "on";
        hass.states["weather.zuhause"].state = "rainy";
      }
      let current = hass;
      await import("../custom_components/homeplan3d/frontend/homeplan3d.js");
      if (params.has("site")) {
        // ?site: the public online demo says what it is and where to get HomePlan 3D
        const de = hass.language === "de";
        // phones: short and at the top of the 3D area, clear of the toolbars at the bottom
        const narrow = innerWidth < 700;
        const bar = document.createElement("div");
        bar.style.cssText =
          (narrow ? "position:fixed;left:50%;top:244px;" : "position:fixed;left:50%;bottom:64px;") +
          "transform:translateX(-50%);z-index:10;display:flex;gap:10px;align-items:center;flex-wrap:nowrap;white-space:nowrap;justify-content:center;max-width:calc(100vw - 32px);padding:8px 14px;border-radius:999px;background:rgba(7,11,20,.88);border:1px solid rgba(0,229,255,.45);color:#cfe9ff;font:13px/1.3 Figtree,Roboto,sans-serif;box-shadow:0 0 18px rgba(0,229,255,.25)";
        const link = (href, text) => `<a href="${href}" target="_blank" rel="noopener" style="color:#00e5ff;font-weight:600;text-decoration:none">${text}</a>`;
        // the install button stands out; GitHub, the manual and the language as plain links
        const install = (text) =>
          `<a href="https://github.com/Mastershort/neonplan3d#installation" target="_blank" rel="noopener" style="background:#00e5ff;color:#06101c;font-weight:700;text-decoration:none;padding:5px 12px;border-radius:999px">${text}</a>`;
        const github = link("https://github.com/Mastershort/neonplan3d", "★ GitHub");
        bar.innerHTML = de
          ? `<span>${narrow ? "Demo" : "Demo mit erfundenen Daten – probier alles aus"}</span>${install(narrow ? "Installieren" : "Jetzt installieren")}${github}${narrow ? "" : link("https://github.com/Samurai9393/HomePlan3D-main/blob/main/docs/manual.md", "Anleitung")}${link("?site&lang=en", narrow ? "EN" : "English")}`
          : `<span>${narrow ? "Demo" : "Demo with invented data – try everything"}</span>${install(narrow ? "Install" : "Install now")}${github}${narrow ? "" : link("https://github.com/Samurai9393/HomePlan3D-main/blob/main/docs/manual.md", "Manual")}${link("?site&lang=de", narrow ? "DE" : "Deutsch")}`;
        const close = document.createElement("button");
        close.textContent = "×";
        close.setAttribute("aria-label", de ? "Schließen" : "Close");
        close.style.cssText = "background:none;border:0;color:#cfe9ff;font-size:16px;cursor:pointer;padding:0 2px";
        close.onclick = () => bar.remove();
        bar.append(close);
        document.body.append(bar);
        // the styles, big and right at the top: visitors should see that NeonPlan is not only neon
        const names = de
          ? { neon: "Neon", blueprint: "Blueprint", day: "Tag", focus: "Nacht / Fokus", synth: "Synthwave", cozy: "Wohnlich", evening: "Wohnlich Abend", winter: "Winterabend", model: "Architekturmodell", pastel: "Pastell", warm: "Holz & Papier" }
          : { neon: "Neon", blueprint: "Blueprint", day: "Day", focus: "Night / Focus", synth: "Synthwave", cozy: "Homely", evening: "Homely evening", winter: "Winter evening", model: "Architect's model", pastel: "Pastel", warm: "Wood & paper" };
        // at the right edge, clear of the house: a narrow column (on phones folded to one button until tapped)
        const looks = document.createElement("div");
        looks.style.cssText =
          (narrow ? "top:300px;" : "top:190px;") +
          "position:fixed;right:12px;z-index:10;display:grid;gap:6px;width:" + (narrow ? "auto" : "176px") + ";max-height:calc(100vh - " + (narrow ? "380px" : "290px") + ");padding:10px;border-radius:16px;background:rgba(7,11,20,.88);border:1px solid rgba(0,229,255,.45);color:#fff;font:14px/1.3 Figtree,Roboto,sans-serif;box-shadow:0 0 18px rgba(0,229,255,.25)";
        const head = document.createElement("button");
        head.style.cssText = "display:grid;gap:2px;text-align:left;background:none;border:0;color:#fff;cursor:pointer;padding:0 2px;font:inherit";
        head.setAttribute("aria-expanded", "true");
        const title = de ? "🎨 Designs" : "🎨 Designs";
        const sub = de ? "Schau dir die verschiedenen Stile an" : "Have a look at the different styles";
        const row = document.createElement("div");
        row.style.cssText = "display:grid;gap:6px;overflow-y:auto;min-height:0";
        const fold = (open) => {
          row.style.display = open ? "grid" : "none";
          head.setAttribute("aria-expanded", String(open));
          head.innerHTML = `<b style="font-size:16px">${title} ${open ? "▾" : "▸"}</b>${open && !narrow ? `<span style="font-size:12px;opacity:.8">${sub}</span>` : ""}`;
        };
        head.onclick = () => fold(row.style.display === "none");
        const panel = document.querySelector("homeplan3d-panel");
        const chips = DEMO_STYLES.map((id) => {
          const b = document.createElement("button");
          b.textContent = names[id];
          b.dataset.style = id;
          b.onclick = () => pick(id);
          return b;
        });
        const paint = (id) => {
          for (const b of chips) {
            const on = b.dataset.style === id;
            b.style.cssText = `width:100%;text-align:left;padding:${narrow ? "7px 12px" : "8px 12px"};border-radius:999px;font:600 ${narrow ? "13px" : "14px"} Figtree,Roboto,sans-serif;cursor:pointer;white-space:nowrap;${on ? "background:#00e5ff;color:#06101c;border:1px solid #00e5ff;box-shadow:0 0 14px rgba(0,229,255,.55)" : "background:rgba(255,255,255,.06);color:#e6f6ff;border:1px solid rgba(0,229,255,.4)"}`;
          }
        };
        const pick = (id) => {
          if (panel) {
            panel._theme = id;
            panel.requestUpdate?.();
          }
          try {
            localStorage.setItem("homeplan3d.theme", id);
          } catch {}
          paint(id);
        };
        paint(panel?._theme && DEMO_STYLES.includes(panel._theme) ? panel._theme : "neon");
        row.append(...chips);
        fold(!narrow);
        looks.append(head, row);
        document.body.append(looks);
        // phones: many visitors open the demo there and wonder about all the buttons – say once what it is
        // made for and offer the clean view (only the house) or the way to a PC
        let seen = false;
        try {
          seen = sessionStorage.getItem("homeplan3d.demoPhoneHint") === "1";
        } catch {
          /* no storage: show it */
        }
        if (narrow && !seen) {
          const veil = document.createElement("div");
          veil.style.cssText =
            "position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(3,6,12,.72);font:15px/1.45 Figtree,Roboto,sans-serif;color:#cfe9ff";
          const box = document.createElement("div");
          box.style.cssText =
            "max-width:360px;padding:20px 18px;border-radius:18px;background:#0b1424;border:1px solid rgba(0,229,255,.45);box-shadow:0 0 24px rgba(0,229,255,.25)";
          const btn = (text, primary) =>
            `<button style="width:100%;margin-top:10px;padding:11px 14px;border-radius:12px;font:600 15px Figtree,Roboto,sans-serif;cursor:pointer;${primary ? "background:#00e5ff;color:#06101c;border:0" : "background:none;color:#cfe9ff;border:1px solid rgba(0,229,255,.45)"}">${text}</button>`;
          box.innerHTML = de
            ? `<b style="font-size:18px;color:#fff">Willkommen in der Demo 👋</b>
               <p style="margin:10px 0 0">HomePlan 3D ist für <b>Wandtablets, Tablets und den PC</b> gemacht – den Grundriss zeichnet man am PC. Am Handy siehst du nur einen kleinen Ausschnitt, deshalb wirken die vielen Knöpfe hier etwas eng.</p>
               <p style="margin:8px 0 0">Tipp: Handy <b>quer</b> halten oder die Demo am PC öffnen.</p>
               ${btn("Nur das Haus zeigen", true)}${btn("Alles ansehen", false)}<p style="margin:10px 0 0;font-size:13px;opacity:.75">Das Auge 👁 unten links holt die Knöpfe zurück.</p>`
            : `<b style="font-size:18px;color:#fff">Welcome to the demo 👋</b>
               <p style="margin:10px 0 0">HomePlan 3D is made for <b>wall tablets, tablets and the PC</b> – you draw the floor plan on a PC. A phone shows only a small part, so all the buttons feel a bit cramped here.</p>
               <p style="margin:8px 0 0">Tip: turn your phone <b>sideways</b> or open the demo on a PC.</p>
               ${btn("Show just the house", true)}${btn("See everything", false)}<p style="margin:10px 0 0;font-size:13px;opacity:.75">The eye 👁 at the bottom left brings the buttons back.</p>`;
          const [clean, all] = box.querySelectorAll("button");
          const done = () => {
            veil.remove();
            try {
              sessionStorage.setItem("homeplan3d.demoPhoneHint", "1");
            } catch {
              /* no storage: it may show again on reload */
            }
          };
          clean.onclick = () => {
            done();
            // the eye of the 3D view: hides every bar so only the house remains (tap the eye again for the buttons)
            const v = document.querySelector("homeplan3d-panel")?.shadowRoot?.querySelector("fp3d-view3d");
            v?.dispatchEvent(new CustomEvent("clean-toggle", { bubbles: true, composed: true }));
          };
          all.onclick = done;
          veil.append(box);
          document.body.append(veil);
        }
      }
      if (params.has("card")) {
        // ?card: the dashboard card next to its visual editor (like Home Assistant's card dialog)
        document.querySelector("homeplan3d-panel").remove();
        const CardClass = customElements.get("homeplan3d-card");
        const wrap = document.createElement("div");
        wrap.style.cssText = "display:grid;grid-template-columns:420px 1fr;gap:24px;padding:24px;font-family:Figtree,Roboto,sans-serif;--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--card-background-color:#1c1c1c;--primary-color:#03a9f4;--divider-color:rgba(225,225,225,.2)";
        const editorBox = document.createElement("div");
        editorBox.style.cssText = "background:#1c1c1c;border-radius:12px;padding:20px";
        const editor = await CardClass.getConfigElement();
        const card = document.createElement("homeplan3d-card");
        let config = {
          type: "custom:homeplan3d-card",
          quality: "low",
          floor: params.get("floor") || "eg",
          flows: false,
          controls: ["walls", "temperature"],
          fullscreen_button: true,
          floor_thumbs: true,
          ...(params.get("stack") ? { floor_stack: params.get("stack") } : {}),
          ...(params.has("nopanel") ? { room_panel: false } : {}),
          ...(params.has("night") ? { night: "00:00-23:59" } : {}),
          ...(params.has("kiosk") ? { idle_return: 1, idle_orbit: true } : {}),
          ...(params.has("tt") ? { time_travel: true } : {}),
          ...(params.has("fill") ? { fill: true } : {}),
          // ?rooms=kind,arbeit: a card for some rooms only (the kids' tablet); ?plan=pgarten with ?plans
          ...(params.get("rooms") ? { rooms: params.get("rooms").split(","), floor: undefined, floor_thumbs: undefined } : {}),
          ...(params.get("plan") ? { plan: params.get("plan"), floor: undefined } : {}),
        };
        // ?tpl: the card only names a card template made in the editor (the room bar and the upper floor come from it)
        if (params.has("tpl")) {
          building.card_templates = [{ id: "kitchen_tablet", name: params.get("lang") === "en" ? "Kitchen tablet" : "Küchen-Tablet", config: { floor: "og", controls: ["walls"], quality: "low" } }];
          config = { type: "custom:homeplan3d-card", template: "kitchen_tablet" };
        }
        card.setConfig(config);
        editor.setConfig(config);
        editor.addEventListener("config-changed", (e) => {
          config = e.detail.config;
          card.setConfig(config);
          editor.setConfig(config);
        });
        editor.hass = hass;
        card.hass = hass;
        editorBox.append(editor);
        wrap.append(editorBox, card);
        document.body.append(wrap);
        window.fp3dCard = card;
      } else {
        const panel = document.querySelector("homeplan3d-panel");
        panel.hass = hass;
        window.addEventListener("hass-more-info", (e) => console.log("more-info", e.detail.entityId));
        panel.narrow = window.innerWidth < 870;
        window.fp3dPanel = panel;
      }
    </script>
  </body>
</html>
