name: 💡 Feature request
description: A concrete idea for HomePlan 3D. For open ideas and voting use the Ideas discussions.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tip: ideas in [Discussions → Ideas](https://github.com/Samurai9393/HomePlan3D-main/discussions/categories/ideas) can be voted on 👍, the most wanted ones come first.
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the situation at home, not only the solution.
      placeholder: "I have an open kitchen with a counter and want to …"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could it look or work in HomePlan 3D?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - 3D view
        - Plan editor
        - Devices and control
        - Furniture
        - Dashboard card
        - Other
  - type: textarea
    id: more
    attributes:
      label: Pictures or examples
      description: Optional. Sketches, photos, screenshots.
