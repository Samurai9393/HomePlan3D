name: 🐞 Bug report
description: Something does not work as described in the manual.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **Issues are for bugs only** – something that worked before or does not work as the manual says.
        > **Wishes and ideas** (a new piece of furniture, a new setting, "it would be nice if …") go to **[Discussions → Ideas](https://github.com/Samurai9393/HomePlan3D-main/discussions/categories/ideas)**, where others can vote with 👍. Wishes posted here are moved there.
        >
        Thanks for reporting!
        Please do not post private data (addresses, IP addresses, real names of people).
  - type: checkboxes
    id: is_bug
    attributes:
      label: Bug, not a wish
      options:
        - label: This is a bug, not a wish for something new.
          required: true
  - type: input
    id: version
    attributes:
      label: HomePlan 3D version
      description: Settings → Marketplace → HomePlan 3D (HACS before HA 2026.11), or Settings → Devices & services → HomePlan 3D.
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.0"
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      description: Pick all that fit – it sorts your report automatically.
      multiple: true
      options:
        - Plan editor
        - 3D view
        - Dashboard card
        - Devices & control
        - Roof & solar fields
        - Outdoor & garden
        - Furniture & packs
        - Energy Pro
        - Camera Cockpit
        - Weather Outside
        - Sound & Cinema
        - Car Pro
        - Live Screens
        - Installation & update
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens?
      description: What did you do, what did you expect, what happened instead?
      placeholder: |
        1. Open the editor …
        2. Tap …
        3. …
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      multiple: true
      options:
        - Desktop browser
        - Tablet (wall tablet)
        - Phone
        - Home Assistant app
  - type: textarea
    id: logs
    attributes:
      label: Screenshots, browser console or HA log
      description: Optional. Drag images in here. Errors from the browser console (F12) help a lot.
